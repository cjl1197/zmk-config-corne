# Core Connection and Feature Settings
#CONFIG_BT_CTLR_PHY_2M=n

# Disable the display engine completely since no screens are attached
CONFIG_ZMK_DISPLAY=n

# REDUCE wireless range to standard desktop levels (Saves massive battery)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=n

# Power Management and Sleep Cycles
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=20000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Enable eager debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

#CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
#CONFIG_BT_PERIPHERAL_PREF_MIN_INT=48
#CONFIG_BT_PERIPHERAL_PREF_MAX_INT=48
#CONFIG_BT_PERIPHERAL_PREF_LATENCY=4

# Enable ZMK Studio for Realtime Keymap Updates
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Battery Telemetry for Fedora Monitoring
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
