# Core Connection and Feature Settings
# Enable 2M PHY for faster data transfer speeds between halves
CONFIG_BT_CTLR_PHY_2M=y

# Disable the display engine completely since no screens are attached
CONFIG_ZMK_DISPLAY=n

# CRITICAL: Max radio power to ensure instant packet delivery through EMI noise
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# CRITICAL: Force peripheral side to prioritize BLE over USB data lines
CONFIG_ZMK_SPLIT_BLE_ROLE_PERIPHERAL=y

# Power Management and Sleep Cycles
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=20000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# GAMING DEBOUNCE: Eager press for 0ms attack, safe 5ms release
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=0
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# GAMING BLE PERFORMANCE: Ultra-tight connection intervals (7.5ms - 11.25ms)
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# Enable ZMK Studio for Realtime Keymap Updates
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Battery Telemetry for Fedora Monitoring
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
